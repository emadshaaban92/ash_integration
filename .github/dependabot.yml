version: 2
updates:
  # Library deps. Minor/patch grouped into one PR; majors stay separate.
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      mix-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # `lua` is deliberately pinned to 0.4 in mix.lock even though mix.exs
      # accepts `~> 0.4 or ~> 1.0`. Both backends are tested in CI (see the
      # `lua` dimension of the test matrix and mix.lock.lua1), and moving the
      # DEFAULT to 1.0 is a security-relevant decision, not a version bump:
      # `lua 1.0` raises the CPU-budget breach as a `pcall`-catchable Lua error
      # instead of killing the runner, and has no wall-clock ceiling of its own.
      # See `Runtime.Lua.Compat`. Promote it by editing mix.lock deliberately.
      - dependency-name: lua

  # Example consumer app.
  - package-ecosystem: mix
    directory: /example
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      example-minor-and-patch:
        update-types:
          - minor
          - patch

  # CI workflow actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
