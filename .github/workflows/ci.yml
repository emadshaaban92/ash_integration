name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  # Compile + test across the supported Elixir/OTP range, on BOTH Lua backends.
  #
  # The `lua` dimension is not cosmetic: the transform runtime picks its backend
  # at COMPILE time (see `Runtime.Lua.Compat`), so the branch a given lockfile
  # does not select is not merely untested — it is not even compiled. A shim
  # exercised on one backend rots silently and gives false confidence, so both
  # lockfiles run the full suite. `mix.lock` (lua 0.4, luerl) is the pinned
  # default; `mix.lock.lua1` (lua 1.0, the package's own VM) is the forward-looking
  # one. `MIX_LOCKFILE` also redirects deps/_build to per-lockfile trees, so the
  # two never share compiled artifacts (see mix.exs).
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }} / ${{ matrix.lua }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19"
            otp: "27"
            lua: "lua-0.4"
            lockfile: "mix.lock"
          - elixir: "1.19"
            otp: "28"
            lua: "lua-0.4"
            lockfile: "mix.lock"
          - elixir: "1.20"
            otp: "28"
            lua: "lua-0.4"
            lockfile: "mix.lock"
          - elixir: "1.20"
            otp: "29"
            lua: "lua-0.4"
            lockfile: "mix.lock"
          - elixir: "1.19"
            otp: "28"
            lua: "lua-1.0"
            lockfile: "mix.lock.lua1"
          - elixir: "1.20"
            otp: "29"
            lua: "lua-1.0"
            lockfile: "mix.lock.lua1"

    env:
      MIX_LOCKFILE: ${{ matrix.lockfile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # `deps.*`/`_build.*` are the per-lockfile trees a non-default MIX_LOCKFILE
      # selects; the cache key carries the lockfile so the two never collide.
      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            deps.*
            _build.*
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ matrix.lua }}-${{ hashFiles(matrix.lockfile) }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ matrix.lua }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --warnings-as-errors

      # The `quality` job's audits read `mix.lock` only, so the alternate
      # lockfile's dependency set would otherwise never be audited at all.
      - name: Dependency + retired-package audit (this lockfile)
        if: ${{ matrix.lockfile != 'mix.lock' }}
        run: |
          mix deps.audit
          mix hex.audit

  # Version-independent checks — run once.
  quality:
    name: Quality (format · credo · sobelow · audits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-quality-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-quality-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies in mix.lock
        run: mix deps.unlock --check-unused

      # `mix.lock.lua1` exists only to pin the second Lua backend, but nothing
      # else sees it: dependabot watches `mix.lock`, and `deps.unlock
      # --check-unused`, `deps.audit` and `hex.audit` all read the default
      # lockfile. Without this guard the first bump to any SHARED dependency
      # leaves the 1.0 tree on stale — possibly vulnerable — transitive deps
      # while CI keeps reporting the `lua` dimension green against a materially
      # different dependency set. The two must differ in the Lua backend and
      # nothing else; regenerate with
      # `cp mix.lock mix.lock.lua1 && MIX_LOCKFILE=mix.lock.lua1 mix deps.update lua`.
      - name: The two lockfiles must differ only in the Lua backend
        if: ${{ !cancelled() }}
        run: |
          strip() { grep -v '^  "\(lua\|luerl\)":' "$1"; }
          if ! diff -u <(strip mix.lock) <(strip mix.lock.lua1); then
            echo "::error::mix.lock and mix.lock.lua1 have drifted apart outside the Lua backend."
            exit 1
          fi

      # !cancelled() so one run surfaces every failure, not just the first.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: mix format --check-formatted

      - name: Static analysis (Credo)
        if: ${{ !cancelled() }}
        run: mix credo

      - name: Security analysis (Sobelow)
        if: ${{ !cancelled() }}
        run: mix sobelow

      - name: Dependency vulnerability audit (mix deps.audit)
        if: ${{ !cancelled() }}
        run: mix deps.audit

      - name: Retired package audit (mix hex.audit)
        if: ${{ !cancelled() }}
        run: mix hex.audit

  # The library has no Repo of its own; its outbound runtime is exercised only
  # through the example app's integration suite. Run it (via mix coveralls, which
  # also reports library coverage — see example/test/test_helper.exs).
  example-test:
    name: Test + coverage (example app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    services:
      db:
        # PG 18+: migrations default primary keys to the built-in uuidv7().
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache example deps and _build
        uses: actions/cache@v6
        with:
          path: |
            example/deps
            example/_build
          key: ${{ runner.os }}-mix-example-test-${{ hashFiles('example/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-example-test-

      # config/test.exs connects to host "db"; point it at the service.
      - name: Map the "db" host to localhost
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Install example dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Set up the test database
        run: mix ash.setup

      - name: Run tests + coverage
        run: mix coveralls

  # Scan the example app's real router/endpoint — coverage the library (no
  # router of its own) can't get. See example/.sobelow-conf.
  sobelow-example:
    name: Sobelow (example app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache example deps and _build
        uses: actions/cache@v6
        with:
          path: |
            example/deps
            example/_build
          key: ${{ runner.os }}-mix-example-${{ hashFiles('example/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-example-

      - name: Install Sobelow (archive)
        run: mix archive.install hex sobelow 0.14.1 --force

      - name: Install example dependencies
        run: mix deps.get

      - name: Security analysis (Sobelow, example router/endpoint)
        run: mix sobelow
